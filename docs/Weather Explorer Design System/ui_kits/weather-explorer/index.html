<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Надворі — Weather Explorer</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: var(--font-sans); }
  #root { min-height: 100vh; }
  /* Calm Leaflet chrome to match the brand */
  .leaflet-container { font-family: var(--font-sans); background: var(--surface-sunken); }
  .leaflet-control-zoom a { border-radius: 8px !important; color: var(--text-secondary) !important; }
  .leaflet-bar { border: none !important; box-shadow: var(--shadow-sm) !important; }
  .leaflet-control-attribution { font-size: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="AnimatedBg.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="SearchBar.jsx"></script>
<script type="text/babel" src="WeekendHighlight.jsx"></script>
<script type="text/babel" src="ForecastGrid.jsx"></script>
<script type="text/babel" src="HourlyChart.jsx"></script>
<script type="text/babel" src="MapPanel.jsx"></script>
<script type="text/babel" src="CompareTable.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
<script type="text/babel" data-presets="react">
  const mount = () => {
    if (!window.NadvoriApp) { setTimeout(mount, 30); return; }
    ReactDOM.createRoot(document.getElementById('root')).render(<window.NadvoriApp />);
    if (window.lucide) window.lucide.createIcons();
  };
  mount();
</script>
</body>
</html>
