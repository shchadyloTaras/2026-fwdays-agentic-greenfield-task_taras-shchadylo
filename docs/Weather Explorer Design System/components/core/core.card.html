<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Switch, Tabs, Badge, Chip } = window.WeatherExplorerDesignSystem_019e02;

function Demo() {
  const [tab, setTab] = React.useState('week');
  const [dark, setDark] = React.useState(false);
  return (
    <div>
      <div className="block">
        <p className="grp">Button — variants & sizes</p>

          <Button size="sm">sm</Button>
          <Button size="lg">lg</Button>
          <Button disabled>disabled</Button>
        </div>
      </div>
      <div className="block">
        <p className="grp">IconButton · Switch · Tabs</p>

          <IconButton icon="plus" label="Збільшити" variant="outline" />
          <IconButton icon="minus" label="Зменшити" variant="outline" />
          <IconButton icon="moon" label="Тема" variant="soft" />
          <Switch checked={dark} onChange={setDark} label="Нічна тема" />

      </div>

          <Badge tone="neutral">12%</Badge>
          <Chip icon="map-pin" active>Львів</Chip>
          <Chip onRemove={()=>{}}>Одеса</Chip>
        </div>
      </div>
    </div>
  );

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
