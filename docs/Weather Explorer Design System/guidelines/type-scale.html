<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Onest · 11 → 64px, calm major-third-ish ramp" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 22px; background: var(--surface); font-family: var(--font-sans); color: var(--text); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 4px 0; border-bottom: 1px solid var(--border-subtle); }
  .r:last-child { border-bottom: 0; }
  .tk { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 96px; flex: none; }
  .s { line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="r"><span class="tk">4xl · 64</span><span class="s" style="font-size:var(--text-4xl);font-weight:800;letter-spacing:-.02em">82</span></div>
  <div class="r"><span class="tk">2xl · 36</span><span class="s" style="font-size:var(--text-2xl);font-weight:700;letter-spacing:-.02em">Надворі сьогодні</span></div>
  <div class="r"><span class="tk">xl · 28</span><span class="s" style="font-size:var(--text-xl);font-weight:600">Прогноз на 7 днів</span></div>
  <div class="r"><span class="tk">lg · 22</span><span class="s" style="font-size:var(--text-lg);font-weight:600">Вихідні у Львові</span></div>
  <div class="r"><span class="tk">base · 16</span><span class="s" style="font-size:var(--text-base)">Чудовий день для прогулянки</span></div>
  <div class="r"><span class="tk">sm · 14</span><span class="s" style="font-size:var(--text-sm);color:var(--text-secondary)">Невеликий дощ після обіду</span></div>
  <div class="r"><span class="tk">xs · 12</span><span class="s" style="font-size:var(--text-xs);color:var(--text-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;font-weight:600">Схід · Захід</span></div>
</body>
</html>
