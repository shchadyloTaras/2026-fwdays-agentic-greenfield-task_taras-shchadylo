<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="4px base grid · space-1 → space-9" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--brand); border-radius: var(--radius-xs); width: 100%; }
  .tk { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 6px; display: block; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;width:4px"></div><span class="tk">1</span><span class="px">4</span></div>
    <div class="item"><div class="bar" style="height:8px;width:8px"></div><span class="tk">2</span><span class="px">8</span></div>
    <div class="item"><div class="bar" style="height:12px;width:12px"></div><span class="tk">3</span><span class="px">12</span></div>
    <div class="item"><div class="bar" style="height:16px;width:16px"></div><span class="tk">4</span><span class="px">16</span></div>
    <div class="item"><div class="bar" style="height:24px;width:24px"></div><span class="tk">5</span><span class="px">24</span></div>
    <div class="item"><div class="bar" style="height:32px;width:32px"></div><span class="tk">6</span><span class="px">32</span></div>
    <div class="item"><div class="bar" style="height:40px;width:40px"></div><span class="tk">7</span><span class="px">40</span></div>
    <div class="item"><div class="bar" style="height:48px;width:48px"></div><span class="tk">8</span><span class="px">48</span></div>
    <div class="item"><div class="bar" style="height:64px;width:64px"></div><span class="tk">9</span><span class="px">64</span></div>
  </div>
</body>
</html>
