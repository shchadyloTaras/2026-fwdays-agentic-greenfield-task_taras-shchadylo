<!-- @dsCard group="Colors" viewport="700x110" name="Neutrals — Slate" subtitle="Cool-gray ramp for text, borders, surfaces" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; border-radius: var(--radius-sm); height: 60px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; border: 1px solid var(--border-subtle); }
  .lbl { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--slate-25)"><span class="lbl" style="color:#394753">25</span></div>
    <div class="sw" style="background:var(--slate-50)"><span class="lbl" style="color:#394753">50</span></div>
    <div class="sw" style="background:var(--slate-100)"><span class="lbl" style="color:#394753">100</span></div>
    <div class="sw" style="background:var(--slate-200)"><span class="lbl" style="color:#394753">200</span></div>
    <div class="sw" style="background:var(--slate-400)"><span class="lbl" style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--slate-600)"><span class="lbl" style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--slate-800)"><span class="lbl" style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--slate-950)"><span class="lbl" style="color:#fff">950</span></div>
  </div>
</body>
</html>
