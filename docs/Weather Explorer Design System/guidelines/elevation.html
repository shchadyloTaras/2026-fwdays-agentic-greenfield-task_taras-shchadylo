<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Soft cool-tinted shadows, xs → xl" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 22px; background: var(--bg); font-family: var(--font-sans); display: flex; gap: 22px; align-items: center; justify-content: space-between; }
  .item { text-align: center; }
  .box { width: 96px; height: 64px; background: var(--surface); border-radius: var(--radius-lg); }
  .tk { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 12px; display: block; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="tk">xs</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="tk">sm</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="tk">md</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="tk">lg</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="tk">xl</span></div>
</body>
</html>
