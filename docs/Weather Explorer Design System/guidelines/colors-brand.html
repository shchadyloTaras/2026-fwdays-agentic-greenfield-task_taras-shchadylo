<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Sky & Sun" subtitle="Sky-blue primary ramp + warm amber accent" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .sw { flex: 1; border-radius: var(--radius-sm); height: 56px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; }
  .lbl { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
  .cap { font-size: 11px; color: var(--text-muted); letter-spacing: var(--tracking-label); text-transform: uppercase; font-weight: 600; margin: 0 0 8px; }
</style>
</head>
<body>
  <p class="cap">Sky · primary</p>
  <div class="row">
    <div class="sw" style="background:var(--sky-50)"><span class="lbl" style="color:#16304c">50</span></div>
    <div class="sw" style="background:var(--sky-100)"><span class="lbl" style="color:#16304c">100</span></div>
    <div class="sw" style="background:var(--sky-300)"><span class="lbl" style="color:#16304c">300</span></div>
    <div class="sw" style="background:var(--sky-500)"><span class="lbl" style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--sky-700)"><span class="lbl" style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--sky-900)"><span class="lbl" style="color:#fff">900</span></div>
  </div>
  <p class="cap">Amber · sun accent</p>
  <div class="row" style="margin-bottom:0">
    <div class="sw" style="background:var(--amber-50)"><span class="lbl" style="color:#855019">50</span></div>
    <div class="sw" style="background:var(--amber-100)"><span class="lbl" style="color:#855019">100</span></div>
    <div class="sw" style="background:var(--amber-300)"><span class="lbl" style="color:#3a2a08">300</span></div>
    <div class="sw" style="background:var(--amber-400)"><span class="lbl" style="color:#3a2a08">400</span></div>
    <div class="sw" style="background:var(--amber-500)"><span class="lbl" style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--amber-700)"><span class="lbl" style="color:#fff">700</span></div>
  </div>
</body>
</html>
